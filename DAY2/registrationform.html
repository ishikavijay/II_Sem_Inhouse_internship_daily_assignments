<!DOCTYPE html>
<html>  
    <head>
        <meta charset ="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>registration</title>
    <link rel="stylesheet" href="style.css"/>
    </head>
   <body>
<HEADER></HEADER>
<div id="divform">

    <form>
        <center>
        <h1 style="color: purple;">Registration Form</h1>
         <h3>submit this form for online registration</h3>
        </center>
         <br>
        <label >
            name:
            <input type="text" id="txtname" class="rounded" required
        placeholder="enter your name"/>
        </label>
        <br/>
        <br>
    <label>
        email:
        <input type="email" id="txtemail" class="rounded" required
        placeholder="enter your Email"/>
    </label>
    <br/>
    <br> 
    <label>
        phone number:
        <input type="text" id="txtphone" class="rounded" required
        placeholder="enter your phone number"/>
    </label>
    <br/>
    <br>
    <label>
        Gender:
        <input type="radio" id="check-male" name="gender" value="male"/>
        <label for="check-male">Male</label>
        <input type="radio" id="check-female" name="gender" value="female"/>
        <label for="check-female">Female</label>
        <input type="radio" id="check-transgender" name="gender" value="transgender"/>
        <label for="check-transgender">Transgender</label>
        <input type="radio" id="check-other" name="gender" value
        <label for="check-other">Other</label>
        <br/>
        <br>
            Date of Birth:
        <input type="date" id="txtdob" class="rounded" required
        placeholder="enter your date of birth"/>
<br/>
<br>
<label for="pwdpassword">Password:</label>   
        <input type="password" id="pwdpassword" class="rounded" required
        placeholder="enter your password"/>
        <br>
        <input type="submit" id="submit">
        <br/>
    </label>      
</form>
</body>
</html>
